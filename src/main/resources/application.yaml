server:
  port: 8081
spring:
  application:
    name: food-delivery-app
  profiles:
    active: dev
  web:
    error:
      include-message: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        generate_statistics: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics

app:
  jwt:
    expiration: 3600000